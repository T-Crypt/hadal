# Publishes HADAL's site to GitHub Pages at https://t-crypt.github.io/hadal/: the product site (site/) at the top,
# and the docs (docs-site/, which builds with base /hadal/docs) beside it under /hadal/docs/. It publishes only from
# main; a pull request that changes the docs is checked by Docs (docs.yml) instead, which builds and publishes
# nothing.
name: Pages

on:
    push:
        branches:
            - main
        paths:
            - "site/**"
            - "docs/**"
            - "docs-site/**"
            - "types/**"
            - "SECURITY.md"
            - "CONTRIBUTING.md"
            - "README.md"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: docs-site/package-lock.json
            - name: Build the docs, with every link checked
              working-directory: docs-site
              run: |
                  npm ci --ignore-scripts
                  npm run build
            - name: Lay the docs beside the product site
              run: |
                  mkdir -p _site
                  cp -R site/. _site/
                  mkdir -p _site/docs
                  cp -R docs-site/dist/. _site/docs/
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

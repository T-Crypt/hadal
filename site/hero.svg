<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="HADAL: a self-hosted agent harness, built for local models">
    <defs>
        <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0A1014"/>
            <stop offset="0.7" stop-color="#0C1319"/>
            <stop offset="1" stop-color="#10181E"/>
        </linearGradient>
        <radialGradient id="pool-signal" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#65D9FF" stop-opacity="0.07"/>
            <stop offset="1" stop-color="#65D9FF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="pool-steel" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#7FB2C8" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#7FB2C8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#65D9FF" stop-opacity="0.5"/>
            <stop offset="0.55" stop-color="#65D9FF" stop-opacity="0.14"/>
            <stop offset="1" stop-color="#65D9FF" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="frame">
            <rect x="0" y="0" width="1280" height="440" rx="18"/>
        </clipPath>
    </defs>

    <g clip-path="url(#frame)">
        <rect width="1280" height="440" fill="url(#depth)"/>
        <ellipse cx="210" cy="90" rx="560" ry="300" fill="url(#pool-signal)"/>
        <ellipse cx="1120" cy="400" rx="620" ry="330" fill="url(#pool-steel)"/>

        <!-- marine snow -->
        <g fill="#E5F1FC">
            <circle cx="140" cy="60" r="1.4" opacity="0.10"/>
            <circle cx="252" cy="180" r="1.1" opacity="0.08"/>
            <circle cx="330" cy="90" r="1.7" opacity="0.12"/>
            <circle cx="420" cy="260" r="1.2" opacity="0.09"/>
            <circle cx="470" cy="40" r="1.0" opacity="0.07"/>
            <circle cx="540" cy="150" r="1.5" opacity="0.11"/>
            <circle cx="610" cy="330" r="1.1" opacity="0.08"/>
            <circle cx="660" cy="80" r="1.3" opacity="0.10"/>
            <circle cx="730" cy="220" r="1.0" opacity="0.07"/>
            <circle cx="790" cy="380" r="1.6" opacity="0.11"/>
            <circle cx="850" cy="120" r="1.2" opacity="0.09"/>
            <circle cx="915" cy="300" r="1.4" opacity="0.10"/>
            <circle cx="975" cy="55" r="1.1" opacity="0.08"/>
            <circle cx="1040" cy="200" r="1.7" opacity="0.12"/>
            <circle cx="1100" cy="340" r="1.2" opacity="0.09"/>
            <circle cx="1170" cy="90" r="1.4" opacity="0.10"/>
            <circle cx="1230" cy="250" r="1.1" opacity="0.08"/>
            <circle cx="90" cy="300" r="1.5" opacity="0.11"/>
            <circle cx="200" cy="390" r="1.2" opacity="0.09"/>
            <circle cx="380" cy="370" r="1.4" opacity="0.10"/>
            <circle cx="700" cy="410" r="1.1" opacity="0.08"/>
            <circle cx="980" cy="420" r="1.3" opacity="0.09"/>
            <circle cx="1210" cy="390" r="1.5" opacity="0.11"/>
            <circle cx="560" cy="420" r="1.2" opacity="0.08"/>
            <circle cx="30" cy="170" r="1.3" opacity="0.10"/>
            <circle cx="640" cy="180" r="1.0" opacity="0.07"/>
            <circle cx="1150" cy="180" r="1.2" opacity="0.09"/>
            <circle cx="460" cy="120" r="1.1" opacity="0.08"/>
        </g>

        <!-- the mark: two uprights, a sounding line, one point of light -->
        <g transform="translate(96,118) scale(3.55)">
            <circle cx="16" cy="26.5" r="9" fill="url(#lamp)"/>
            <path d="M8 5V27" stroke="#E5F1FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M24 5V27" stroke="#E5F1FC" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M8 12L16 21L24 12" stroke="#E5F1FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="16" cy="26.5" r="1.7" fill="#65D9FF"/>
        </g>

        <!-- wordmark and lines -->
        <text x="252" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="600" letter-spacing="9" fill="#E5F1FC">HADAL</text>
        <text x="256" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#91A9BC">A self-hosted agent harness, built for local models.</text>
        <text x="256" y="270" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="14" letter-spacing="1" fill="#8198AD">durable  ·  multiplayer  ·  mobile-first  ·  one GPU</text>

        <!-- depth scale -->
        <g stroke="#5B7284" stroke-width="1" opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5B7284">
            <line x1="1216" y1="70" x2="1240" y2="70"/>
            <line x1="1224" y1="140" x2="1240" y2="140"/>
            <line x1="1216" y1="210" x2="1240" y2="210"/>
            <line x1="1224" y1="280" x2="1240" y2="280"/>
            <line x1="1216" y1="350" x2="1240" y2="350"/>
            <line x1="1240" y1="70" x2="1240" y2="350"/>
            <text x="1132" y="74">1,000 m</text>
            <text x="1140" y="214">3,000 m</text>
            <text x="1132" y="354">5,000 m</text>
        </g>
    </g>
    <rect x="0.5" y="0.5" width="1279" height="439" rx="17.5" fill="none" stroke="#18242C" stroke-width="1"/>
</svg>
